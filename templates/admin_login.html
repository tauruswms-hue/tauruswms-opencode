<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taurus Suite - Login</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #e63946;
        }
        html, body { margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #1a365d 0%, #2d4a77 100%);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 12px;
            overflow-y: auto;
        }
        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 3px solid #f6ad55;
            outline-offset: 2px;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-card .fa-shield-halved {
            color: var(--primary-color);
            font-size: 48px;
        }
    </style>
</head>
<body data-1p-ignore data-bwignore="true" data-lpignore="true" data-form-type="other">
    <div class="login-card">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='logo/Taurussuite.jpg') }}" alt="Taurus Suite" style="max-height: 80px;">
            <h3 class="mt-3">Taurus Suite</h3>
            <p class="text-muted">Panel de Administración</p>
        </div>
        
        <form method="POST" autocomplete="off" data-1p-ignore data-bwignore="true" data-lpignore="true" data-form-type="other">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="usuario-admin">Usuario Admin</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user" aria-hidden="true"></i></span>
                    <input type="text" name="username" id="usuario-admin" class="form-control" required autofocus autocomplete="off" data-1p-ignore data-bwignore="true" data-lpignore="true" data-form-type="other">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock" aria-hidden="true"></i></span>
                    <input type="password" name="password" id="password" class="form-control" required autocomplete="off" data-1p-ignore data-bwignore="true" data-lpignore="true" data-form-type="other">
                    <button type="button" class="btn btn-outline-secondary" id="togglePassword"
                            onclick="togglePassword()" aria-label="Mostrar contraseña"
                            aria-pressed="false" aria-controls="password" title="Mostrar contraseña">
                        <i class="fas fa-eye" id="toggleIcon" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-sign-in-alt me-2"></i>Ingresar
            </button>
        </form>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mt-3" aria-live="polite" aria-label="Notificaciones">
                {% for category, message in messages %}
                    {% set grave = category in ('danger', 'error', 'warning') %}
                    <div class="alert {{ 'alert-danger' if grave else 'alert-info' }} py-2 px-3 mb-2"
                         role="{{ 'alert' if grave else 'status' }}" style="font-size: 0.85rem; margin-bottom: 0;">
                        {{ message }}
                    </div>
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        <hr class="my-4">
        <div class="text-center">
            <small class="text-muted">Taurus Suite</small>
        </div>
    </div>
    <script src="{{ url_for('static', filename='vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
    <script>
        function togglePassword() {
            var passwordInput = document.getElementById('password');
            var boton = document.getElementById('togglePassword');
            var toggleIcon = document.getElementById('toggleIcon');
            var visible = passwordInput.type === 'password';
            passwordInput.type = visible ? 'text' : 'password';
            toggleIcon.classList.toggle('fa-eye-slash', visible);
            toggleIcon.classList.toggle('fa-eye', !visible);
            boton.setAttribute('aria-pressed', String(visible));
            boton.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
            boton.title = visible ? 'Ocultar contraseña' : 'Mostrar contraseña';
        }
    </script>
</body>
</html>
