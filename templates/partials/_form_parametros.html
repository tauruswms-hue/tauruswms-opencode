<main class="params-content">
    <form action="{{ url_for('parametros.actualizar') }}" method="POST" class="params-form">
        <section class="params-section border-orange">
            <h3><i class="fas fa-warehouse"></i> Ajustes del Almacén</h3>
            <div class="params-grid">
                <div class="params-field">
                    <label>Nombre del Almacén</label>
                    <input type="text" name="nombredelalmacen" value="{{ config.nombredelalmacen or '' }}">
                </div>
            </div>
        </section>

        <section class="params-section border-blue">
            <h3><i class="fas fa-clipboard-list"></i> Lógica de Operación</h3>
            <div class="params-grid">
                <div class="params-field">
                    <label>Métodos de Picking habilitados</label>
                    <div class="params-checkboxes">
                        <div class="params-checkbox-row">
                            <label class="params-checkbox">
                                <input type="checkbox" name="metodosdepicking" value="fifo" {% if 'fifo' in config.metodosdepicking %}checked{% endif %}>
                                <span>FIFO (Primero en entrar, primero en salir)</span>
                            </label>
                            <label class="params-checkbox params-default" title="Usar como método por defecto">
                                <input type="radio" name="metodo_picking_default" value="fifo" {% if config.metodo_picking_default == 'fifo' %}checked{% endif %}>
                                <span>Por defecto</span>
                            </label>
                        </div>
                        <div class="params-checkbox-row">
                            <label class="params-checkbox">
                                <input type="checkbox" name="metodosdepicking" value="lifo" {% if 'lifo' in config.metodosdepicking %}checked{% endif %}>
                                <span>LIFO (Último en entrar, primero en salir)</span>
                            </label>
                            <label class="params-checkbox params-default" title="Usar como método por defecto">
                                <input type="radio" name="metodo_picking_default" value="lifo" {% if config.metodo_picking_default == 'lifo' %}checked{% endif %}>
                                <span>Por defecto</span>
                            </label>
                        </div>
                        <div class="params-checkbox-row">
                            <label class="params-checkbox">
                                <input type="checkbox" name="metodosdepicking" value="fefo" {% if 'fefo' in config.metodosdepicking %}checked{% endif %}>
                                <span>FEFO (Próximo a vencer)</span>
                            </label>
                            <label class="params-checkbox params-default" title="Usar como método por defecto">
                                <input type="radio" name="metodo_picking_default" value="fefo" {% if config.metodo_picking_default == 'fefo' %}checked{% endif %}>
                                <span>Por defecto</span>
                            </label>
                        </div>
                        <div class="params-checkbox-row">
                            <label class="params-checkbox">
                                <input type="checkbox" name="metodosdepicking" value="libre" {% if 'libre' in config.metodosdepicking %}checked{% endif %}>
                                <span>Picking Libre</span>
                            </label>
                            <label class="params-checkbox params-default" title="Usar como método por defecto">
                                <input type="radio" name="metodo_picking_default" value="libre" {% if config.metodo_picking_default == 'libre' %}checked{% endif %}>
                                <span>Por defecto</span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="params-field">
                    <label>Alerta de Stock Bajo (%)</label>
                    <input type="number" step="0.01" name="bajostock" value="{{ config.bajostock or 0 }}" class="input-standard-height">
                </div>
                <div class="params-field">
                    <label>Días por defecto en filtros de fecha</label>
                    <input type="number" min="1" max="3650" name="dias_filtro_fechas" value="{{ config.dias_filtro_fechas or 30 }}" class="input-standard-height">
                </div>
            </div>
        </section>

<div class="params-actions">
            <button type="submit" class="btn-save">
                <i class="fas fa-save"></i> Guardar Cambios
            </button>
            <button type="reset" class="btn-discard">
                <i class="fas fa-undo"></i> Descartar
            </button>
            <button type="button" class="btn-discard" onclick="window.location.href='{{ url_for('index') }}'">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
        </div>
    </form>
</main>

<script>
function sincronizarMetodosPicking() {
    var cbs = document.querySelectorAll('input[name="metodosdepicking"]');
    var radios = document.querySelectorAll('input[name="metodo_picking_default"]');
    var activo = null;
    radios.forEach(function(r) { if (r.checked) activo = r.value; });
    var enabled = [];
    cbs.forEach(function(cb) { if (cb.checked) enabled.push(cb.value); });
    radios.forEach(function(r) { r.disabled = enabled.indexOf(r.value) === -1; });
    if (enabled.indexOf(activo) === -1) {
        radios.forEach(function(r) { r.checked = (r.value === enabled[0]); });
        if (!enabled.length) radios.forEach(function(r) { r.checked = false; });
    }
}
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('input[name="metodosdepicking"]').forEach(function(cb) {
        cb.addEventListener('change', sincronizarMetodosPicking);
    });
    sincronizarMetodosPicking();
});
</script>
