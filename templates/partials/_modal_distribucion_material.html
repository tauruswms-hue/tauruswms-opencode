<div id="modalDistribucion" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1100; justify-content:center; align-items:flex-start; overflow-y:auto; padding:20px 0;">
    <div class="modal-card" style="background:white; width:96%; max-width:1080px; border-radius:8px; box-sizing:border-box; margin:0 auto; padding:0; display:flex; flex-direction:column; max-height:calc(100vh - 40px);">
        <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; padding:18px 25px 14px; border-bottom:1px solid #eee; flex-shrink:0;">
            <div>
                <h3 style="margin:0;"><i class="fas fa-warehouse" style="color:#16a085;"></i> Distribución de stock</h3>
                <div id="distMaterial" style="color:#555; margin-top:4px; font-size:0.95rem;"></div>
            </div>
            <button class="close-btn" onclick="cerrarDistribucion()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
        </div>

        <div style="overflow-y:auto; flex:1; padding:16px 25px;">
            <div id="distResumen" class="dist-resumen"></div>
            <div id="distMensaje" class="mat-vacio" style="display:none;"></div>
            <div style="overflow-x:auto;">
                <table id="distTabla" class="dist-tabla" style="display:none;">
                    <thead>
                        <tr>
                            <th>Ubicación</th>
                            <th>Zona</th>
                            <th>Contenedor</th>
                            <th>Lote</th>
                            <th>Tipo de stock</th>
                            <th>Vencimiento</th>
                            <th class="num" title="Existencia física en la posición">Total</th>
                            <th class="num" title="Lo que se puede usar para nuevos pedidos">Disponible</th>
                            <th class="num" title="En camino hacia esta posición">Entrando</th>
                            <th class="num" title="Comprometido para salir de esta posición">Saliendo</th>
                        </tr>
                    </thead>
                    <tbody id="distCuerpo"></tbody>
                    <tfoot>
                        <tr>
                            <th colspan="6" style="text-align:right;">Totales</th>
                            <th class="num" id="distTotTotal"></th>
                            <th class="num" id="distTotDisponible"></th>
                            <th class="num" id="distTotEntrando"></th>
                            <th class="num" id="distTotSaliendo"></th>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <div style="display:flex; justify-content:flex-end; padding:14px 25px; border-top:1px solid #eee; flex-shrink:0;">
            <button type="button" onclick="cerrarDistribucion()" style="background:#95a5a6; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer;">Cerrar</button>
        </div>
    </div>
</div>
