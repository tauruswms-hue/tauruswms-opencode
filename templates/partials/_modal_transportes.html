<div id="modalTransportes" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 20px 0;">
    <div class="modal-card" style="background: white; width: 90%; max-width: 820px; border-radius: 8px; box-sizing: border-box; margin: 0 auto; display: flex; flex-direction: column; max-height: calc(100vh - 40px);">

        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; padding: 18px 25px 15px; border-bottom: 1px solid #eee; flex-shrink: 0;">
            <h3 id="modalTitle" style="margin:0; color:#2c3e50;">Transporte</h3>
            <button class="close-btn" onclick="closeModal()" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:#95a5a6;">&times;</button>
        </div>

        <form action="{{ url_for('transportes.guardar') }}" method="POST" id="formTransportes" style="display:flex; flex-direction:column; flex:1; min-height:0;">
            <input type="hidden" name="id_transporte" id="form_id_transporte">

            <div class="modal-scroll-body" style="overflow-y:auto; flex:1; padding:20px 25px;">
                <div class="tra-fila">
                    <div class="tra-campo" style="flex: 1; min-width: 140px;">
                        <label>Código *</label>
                        <input type="text" name="codigo" id="form_codigo" required maxlength="{{ largos.codigo }}">
                    </div>
                    <div class="tra-campo" style="flex: 3; min-width: 220px;">
                        <label>Razón Social *</label>
                        <input type="text" name="razonsocial" id="form_razonsocial" required maxlength="{{ largos.razonsocial }}">
                    </div>
                    <div class="tra-campo" style="flex: 0 0 130px; min-width: 130px;">
                        <label title="Un transporte inactivo no se ofrece para clientes ni pedidos nuevos">Estado</label>
                        <select name="activo" id="form_activo" title="Un transporte inactivo no se ofrece para clientes ni pedidos nuevos">
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                </div>

                <div class="tra-fila">
                    <div class="tra-campo">
                        <label>CUIT</label>
                        <input type="text" name="cuit" id="form_cuit" maxlength="13" inputmode="numeric" data-cuit
                               pattern="\d{2}-\d{8}-\d" placeholder="99-99999999-9" title="Formato: 99-99999999-9">
                    </div>
                    <div class="tra-campo">
                        <label>Teléfono</label>
                        <input type="text" name="telefono" id="form_telefono" maxlength="{{ largos.telefono }}">
                    </div>
                    <div class="tra-campo" style="flex: 1.5;">
                        <label>Mail</label>
                        <input type="email" name="email" id="form_email" maxlength="{{ largos.email }}" placeholder="nombre@empresa.com">
                    </div>
                </div>

                <div class="tra-fila">
                    <div class="tra-campo">
                        <label>Muelle de salida (despacho)</label>
                        <select name="id_muelle_salida" id="form_id_muelle_salida">
                            <option value="">-- Sin muelle asignado --</option>
                        </select>
                        <small class="tra-ayuda">Ubicación desde la que despacha este transporte. Se ofrecen las ubicaciones cuyo tipo es de salida.</small>
                    </div>
                </div>

                <div style="border:1px solid #eee; padding:15px; border-radius:8px; background:#fafafa;">
                    <h4 style="margin:0 0 4px; font-size:0.9rem; color:#333;"><i class="fas fa-map-signs"></i> Rutas que cubre</h4>
                    <small class="tra-ayuda" style="margin-bottom:8px;">Opcional. En la ficha de un cliente, al elegir una ruta se ofrecen los transportes que la cubren.</small>
                    <table class="tra-tabla">
                        <thead>
                            <tr>
                                <th style="width:38%;">Ruta</th>
                                <th>Observaciones</th>
                                <th style="width:34px;"></th>
                            </tr>
                        </thead>
                        <tbody id="listaRutasCuerpo"></tbody>
                    </table>
                    <div id="tra_sin_rutas" class="tra-vacio">Este transporte no tiene rutas asignadas.</div>
                    <button type="button" onclick="agregarFilaRuta()" style="margin-top:8px; background:#16a085; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:0.82rem;">
                        <i class="fas fa-plus"></i> Agregar Ruta
                    </button>
                </div>
            </div>

            <div class="modal-footer" style="display:flex; justify-content:flex-end; gap:10px; padding:15px 25px; border-top:1px solid #eee; flex-shrink:0;">
                <button type="button" class="btn-sec" onclick="closeModal()" style="background: #95a5a6; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor:pointer;">Cancelar</button>
                <button type="submit" class="btn-pri" style="background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor:pointer;">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>
