<div id="modalTransportes" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:flex-start; overflow-y:auto; padding:20px 0;">
    <div style="background:white; width:95%; max-width:750px; border-radius:8px; box-sizing:border-box; margin:auto; display:flex; flex-direction:column; max-height:calc(100vh - 40px);">

        <div style="display:flex; justify-content:space-between; align-items:center; padding:18px 25px 15px; border-bottom:1px solid #eee; flex-shrink:0;">
            <h3 id="modalTitle" style="margin:0;">Transporte</h3>
            <button onclick="closeModal()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
        </div>

        <form action="{{ url_for('transportes.guardar') }}" method="POST" id="formTransportes" style="display:flex; flex-direction:column; flex:1; min-height:0;">
            <input type="hidden" name="id_transporte" id="form_id_transporte">

            <div style="overflow-y:auto; flex:1; padding:20px 25px;">
                <div style="display:grid; grid-template-columns:1fr 2fr; gap:15px; margin-bottom:15px;">
                    <div class="form-group">
                        <label style="display:block; font-size:0.8rem; font-weight:bold; color:#555;">Código *</label>
                        <input type="text" name="codigo" id="form_codigo" required style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px;">
                    </div>
                    <div class="form-group">
                        <label style="display:block; font-size:0.8rem; font-weight:bold; color:#555;">Razón Social *</label>
                        <input type="text" name="razonsocial" id="form_razonsocial" required style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px;">
                    </div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr 1.5fr; gap:15px; margin-bottom:15px;">
                    <div class="form-group">
                        <label style="display:block; font-size:0.8rem; font-weight:bold; color:#555;">CUIT (11 dígitos) *</label>
                        <input type="text" name="cuit" id="form_cuit" required pattern="[0-9]{11}" title="Debe contener exactamente 11 números sin guiones" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px;">
                    </div>
                    <div class="form-group">
                        <label style="display:block; font-size:0.8rem; font-weight:bold; color:#555;">Teléfono</label>
                        <input type="text" name="telefono" id="form_telefono" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px;">
                    </div>
                    <div class="form-group">
                        <label style="display:block; font-size:0.8rem; font-weight:bold; color:#555;">Email</label>
                        <input type="email" name="email" id="form_email" placeholder="ejemplo@correo.com" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px;">
                    </div>
                </div>

                <div style="display:grid; grid-template-columns:2fr 1fr; gap:15px; margin-bottom:15px;">
                    <div class="form-group">
                        <label style="display:block; font-size:0.8rem; font-weight:bold; color:#555;">Muelle de Salida (despacho)</label>
                        <select name="id_muelle_salida" id="form_id_muelle_salida" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px;">
                            <option value="">-- Sin muelle asignado --</option>
                        </select>
                    </div>
                    <div class="form-group" style="display:flex; align-items:flex-end; padding-bottom:4px;">
                        <label style="font-size:0.9rem; cursor:pointer;">
                            <input type="checkbox" name="activo" id="form_activo" checked> Habilitado para despachos
                        </label>
                    </div>
                </div>

                <div style="border:1px solid #eee; padding:15px; border-radius:8px; background:#fafafa;">
                    <h4 style="margin-top:0; font-size:0.9rem; color:#333;"><i class="fas fa-map-signs"></i> Rutas y Zonas de Cobertura</h4>
                    <table style="width:100%; border-collapse:collapse; margin-bottom:10px;">
                        <thead>
                            <tr style="font-size:0.75rem; color:#666; text-transform:uppercase;">
                                <th style="text-align:left; padding:5px;">Ruta</th>
                                <th style="text-align:left; padding:5px;">Observaciones / Notas</th>
                                <th style="width:30px;"></th>
                            </tr>
                        </thead>
                        <tbody id="listaRutasCuerpo"></tbody>
                    </table>
                    <button type="button" onclick="agregarFilaRuta()" style="background:#eee; border:1px solid #ccc; padding:5px 12px; border-radius:4px; cursor:pointer; font-size:0.8rem;">
                        <i class="fas fa-plus"></i> Añadir Ruta
                    </button>
                </div>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:10px; padding:15px 25px; border-top:1px solid #eee; flex-shrink:0;">
                <button type="button" onclick="closeModal()" style="padding:10px 20px; border-radius:4px; border:1px solid #ccc; background:white; cursor:pointer;">Cancelar</button>
                <button type="submit" style="padding:10px 20px; border-radius:4px; border:none; background:#3498db; color:white; cursor:pointer; font-weight:bold;">Guardar Cambios</button>
            </div>
        </form>
    </div>
</div>
