<div id="modalProveedor" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle">Nuevo Proveedor</h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form action="{{ url_for('proveedores.guardar') }}" method="POST" id="formProveedor">
            <input type="hidden" name="id" id="form_id">

            <div class="modal-scroll-body">
                <div class="form-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Código Proveedor *</label>
                            <input type="text" name="codigo" id="form_codigo" required maxlength="{{ largos.codigo }}">
                        </div>
                        <div class="form-group">
                            <label>CUIT</label>
                            <input type="text" name="cuit" id="form_cuit" maxlength="13" inputmode="numeric" data-cuit
                                   pattern="\d{2}-\d{8}-\d" placeholder="99-99999999-9" title="Formato: 99-99999999-9">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Razón Social *</label>
                            <input type="text" name="razonsocial" id="form_razon" required maxlength="{{ largos.razonsocial }}">
                        </div>
                        <div class="form-group" style="max-width:180px;">
                            <label>Estado</label>
                            <select name="activo" id="form_activo" style="width:100%; box-sizing:border-box; padding:10px; border:1px solid #ddd; border-radius:4px; background:white; font-size:0.95rem;">
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" id="form_email" maxlength="{{ largos.email }}">
                        </div>
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="text" name="telefono" id="form_tel" maxlength="{{ largos.telefono }}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Dirección</label>
                        <textarea name="direccion" id="form_dir" rows="4" maxlength="{{ direccion_max }}" style="width:100%; box-sizing:border-box; padding:8px; border:1px solid #ddd; border-radius:4px; resize:vertical;"></textarea>
                        <small style="color:#888;"><span id="form_dir_cuenta">0</span> / {{ direccion_max }} caracteres</small>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-sec" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-pri">Guardar</button>
            </div>
        </form>
    </div>
</div>
