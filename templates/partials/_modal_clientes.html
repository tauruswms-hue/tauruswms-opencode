<div id="modalCliente" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 20px 0;">
    <div class="modal-card" style="background: white; width: 90%; max-width: 850px; border-radius: 8px; box-sizing: border-box; margin: auto; display: flex; flex-direction: column; max-height: calc(100vh - 40px);">

        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; padding: 18px 25px 15px; border-bottom: 1px solid #eee; flex-shrink: 0;">
            <h3 id="modalTitle" style="margin:0; color:#2c3e50;">Ficha de Cliente</h3>
            <button class="close-btn" onclick="closeModalCliente()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
        </div>

        <form action="{{ url_for('clientes.guardar') }}" method="POST" id="formCliente" style="display:flex; flex-direction:column; flex:1; min-height:0;">
            <input type="hidden" name="id_cliente" id="form_id_cliente">

            <div class="modal-scroll-body" style="overflow-y:auto; flex:1; padding:20px 25px;">
                <div class="form-row" style="display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 150px;">
                        <label style="font-size:0.8rem; font-weight:bold; color:#666;">Código *</label>
                        <input type="text" name="codigo" id="form_codigo" required style="width:100%; padding: 10px; border: 1px solid #ddd; border-radius:4px; box-sizing:border-box;">
                    </div>
                    <div class="form-group" style="flex: 2; min-width: 200px;">
                        <label style="font-size:0.8rem; font-weight:bold; color:#666;">Razón Social *</label>
                        <input type="text" name="razonsocial" id="form_razonsocial" required style="width:100%; padding: 10px; border: 1px solid #ddd; border-radius:4px; box-sizing:border-box;">
                    </div>
                </div>

                <div class="form-row" style="display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 150px;">
                        <label style="font-size:0.8rem; font-weight:bold; color:#666;">CUIT</label>
                        <input type="text" name="cuit" id="form_cuit" style="width:100%; padding: 10px; border: 1px solid #ddd; border-radius:4px; box-sizing:border-box;">
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 150px;">
                        <label style="font-size:0.8rem; font-weight:bold; color:#666;">Teléfono</label>
                        <input type="text" name="telefono" id="form_telefono" style="width:100%; padding: 10px; border: 1px solid #ddd; border-radius:4px; box-sizing:border-box;">
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 150px;">
                        <label style="font-size:0.8rem; font-weight:bold; color:#666;">Email</label>
                        <input type="email" name="email" id="form_email" style="width:100%; padding: 10px; border: 1px solid #ddd; border-radius:4px; box-sizing:border-box;">
                    </div>
                </div>

                <div class="form-row" style="display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 2; min-width: 200px;">
                        <label style="font-size:0.8rem; font-weight:bold; color:#666;">Dirección</label>
                        <input type="text" name="direccion" id="form_direccion" style="width:100%; padding: 10px; border: 1px solid #ddd; border-radius:4px; box-sizing:border-box;">
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 150px;">
                        <label style="font-size:0.8rem; font-weight:bold; color:#666;">Localidad</label>
                        <input type="text" name="localidad" id="form_localidad" style="width:100%; padding: 10px; border: 1px solid #ddd; border-radius:4px; box-sizing:border-box;">
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 150px;">
                        <label style="font-size:0.8rem; font-weight:bold; color:#666;">Provincia</label>
                        <input type="text" name="provincia" id="form_provincia" style="width:100%; padding: 10px; border: 1px solid #ddd; border-radius:4px; box-sizing:border-box;">
                    </div>
                </div>

                <div class="form-section" style="margin-bottom: 15px; background:#f8f9fa; padding:15px; border-radius:8px; border:1px solid #dee2e6;">
                    <h4 style="margin-top:0;"><i class="fas fa-truck"></i> Logística Predeterminada</h4>
                    <div class="form-row" style="display: flex; gap: 15px; flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label style="font-size:0.8rem; font-weight:bold; color:#666;">Ruta de Entrega</label>
                            <select name="id_ruta" id="form_id_ruta" style="width:100%; padding: 10px; border: 1px solid #ddd; border-radius:4px;" onchange="filtrarTransportes(this.value)">
                                <option value="">-- Seleccionar Ruta --</option>
                                {% for r in rutas %}
                                <option value="{{ r.id_ruta }}">{{ r.nombre_ruta }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label style="font-size:0.8rem; font-weight:bold; color:#666;">Transporte Habitual</label>
                            <select name="id_transporte_predeterminado" id="form_id_transporte" style="width:100%; padding: 10px; border: 1px solid #ddd; border-radius:4px;">
                                <option value="">-- Seleccionar Transporte --</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div style="display:flex; align-items:center; gap:10px; background:#fff4e5; padding:10px; border-radius:5px;">
                    <input type="checkbox" name="activo" id="form_activo" value="1" style="width:18px; height:18px;">
                    <label for="form_activo" style="margin:0; font-weight:bold; color:#856404;">¿Cliente habilitado para operar?</label>
                </div>
            </div>

            <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 10px; padding: 15px 25px; border-top: 1px solid #eee; flex-shrink: 0;">
                <button type="button" class="btn-sec" onclick="closeModalCliente()" style="background: #95a5a6; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor:pointer;">Cancelar</button>
                <button type="submit" class="btn-pri" style="background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor:pointer;">Guardar Cliente</button>
            </div>
        </form>
    </div>
</div>
