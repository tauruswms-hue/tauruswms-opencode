<div id="modalCliente" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 20px 0;">
    <div class="modal-card" style="background: white; width: 90%; max-width: 980px; border-radius: 8px; box-sizing: border-box; margin: 0 auto; display: flex; flex-direction: column; max-height: calc(100vh - 40px);">

        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; padding: 18px 25px 15px; border-bottom: 1px solid #eee; flex-shrink: 0;">
            <h3 id="modalTitle" style="margin:0; color:#2c3e50;">Ficha de Cliente</h3>
            <button class="close-btn" onclick="closeModalCliente()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
        </div>

        <form action="{{ url_for('clientes.guardar') }}" method="POST" id="formCliente" style="display:flex; flex-direction:column; flex:1; min-height:0;">
            <input type="hidden" name="id_cliente" id="form_id_cliente">

            <div class="cli-tabs">
                <button type="button" class="cli-tab-btn active" data-tab="tab-cli-datos"><i class="fas fa-id-card"></i> Datos generales</button>
                <button type="button" class="cli-tab-btn" data-tab="tab-cli-contactos"><i class="fas fa-address-book"></i> Contactos <span id="cli_contactos_cantidad" class="cli-cuenta"></span></button>
                <button type="button" class="cli-tab-btn" data-tab="tab-cli-logistica"><i class="fas fa-truck"></i> Logística</button>
            </div>

            <div class="modal-scroll-body cli-cuerpo">
                <div class="cli-tab-panel active" id="tab-cli-datos">
                <div class="cli-fila">
                    <div class="cli-campo" style="flex: 1; min-width: 140px;">
                        <label>Código *</label>
                        <input type="text" name="codigo" id="form_codigo" required maxlength="100">
                    </div>
                    <div class="cli-campo" style="flex: 3; min-width: 220px;">
                        <label>Razón Social *</label>
                        <input type="text" name="razonsocial" id="form_razonsocial" required maxlength="200">
                    </div>
                    <div class="cli-campo" style="flex: 0 0 130px; min-width: 130px;">
                        <label title="Un cliente inactivo no se ofrece al cargar pedidos">Estado</label>
                        <select name="activo" id="form_activo" title="Un cliente inactivo no se ofrece al cargar pedidos">
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                </div>

                <div class="cli-fila">
                    <div class="cli-campo" style="flex: 3; min-width: 220px;">
                        <label>Nombre de Fantasía</label>
                        <input type="text" name="nombre_fantasia" id="form_nombre_fantasia" maxlength="200"
                               placeholder="Nombre comercial, si es distinto de la razón social">
                    </div>
                    <div class="cli-campo" style="flex: 1; min-width: 160px;">
                        <label>CUIT</label>
                        <input type="text" name="cuit" id="form_cuit" maxlength="13" inputmode="numeric" data-cuit
                               pattern="\d{2}-\d{8}-\d" placeholder="99-99999999-9" title="Formato: 99-99999999-9">
                    </div>
                </div>

                <div class="cli-fila">
                    <div class="cli-campo">
                        <label>Mail principal</label>
                        <input type="email" name="email" id="form_email" maxlength="100" placeholder="nombre@empresa.com">
                    </div>
                    <div class="cli-campo">
                        <label>Sitio Web</label>
                        <input type="text" name="sitio_web" id="form_sitio_web" maxlength="255" placeholder="www.empresa.com">
                    </div>
                    <div class="cli-campo">
                        <label>Teléfono</label>
                        <input type="text" name="telefono" id="form_telefono" maxlength="50">
                    </div>
                </div>

                <div class="cli-fila">
                    <div class="cli-campo" style="flex: 2; min-width: 220px;">
                        <label>Domicilio</label>
                        <input type="text" name="direccion" id="form_direccion" maxlength="255" placeholder="Calle y número">
                    </div>
                    <div class="cli-campo">
                        <label>Localidad</label>
                        <input type="text" name="localidad" id="form_localidad" maxlength="100">
                    </div>
                    <div class="cli-campo">
                        <label>Provincia</label>
                        <input type="text" name="provincia" id="form_provincia" maxlength="100">
                    </div>
                </div>

                </div>

                <div class="cli-tab-panel" id="tab-cli-contactos">
                    <small style="color:#888; display:block; margin-bottom:10px;">
                        Personas del cliente con las que se trata. El primero de la lista es el contacto principal.
                    </small>
                    <table class="cli-tabla">
                        <thead>
                            <tr>
                                <th>Nombre *</th>
                                <th>Apellido</th>
                                <th title="Departamento o sección a la que pertenece">Depto. / Sección</th>
                                <th>Rol</th>
                                <th>Teléfono</th>
                                <th>Mail</th>
                                <th class="col-accion"></th>
                            </tr>
                        </thead>
                        <tbody id="listaContactosCuerpo"></tbody>
                    </table>
                    <div id="cli_sin_contactos" class="cli-vacio">Este cliente no tiene contactos cargados.</div>
                    <button type="button" onclick="agregarFilaContacto()" style="margin-top:10px; background:#16a085; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:0.82rem;">
                        <i class="fas fa-plus"></i> Agregar Contacto
                    </button>
                </div>

                <div class="cli-tab-panel" id="tab-cli-logistica">

                <div class="form-section" style="margin-bottom: 15px; background:#f8f9fa; padding:15px; border-radius:8px; border:1px solid #dee2e6; margin-bottom:0;">
                    <h4 style="margin-top:0;"><i class="fas fa-truck"></i> Logística Predeterminada</h4>
                    <div class="form-row" style="display: flex; gap: 15px; flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label style="font-size:0.8rem; font-weight:bold; color:#666;">Ruta de Entrega</label>
                            <select name="id_ruta" id="form_id_ruta" style="width:100%; padding: 10px; border: 1px solid #ddd; border-radius:4px;" onchange="filtrarTransportes(this.value)">
                                <option value="">-- Seleccionar Ruta --</option>
                                {% for r in rutas %}
                                <option value="{{ r.id_ruta }}">{{ r.nombre_ruta }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label style="font-size:0.8rem; font-weight:bold; color:#666;">Transporte Habitual</label>
                            <select name="id_transporte_predeterminado" id="form_id_transporte" style="width:100%; padding: 10px; border: 1px solid #ddd; border-radius:4px;">
                                <option value="">-- Seleccionar Transporte --</option>
                            </select>
                        </div>
                    </div>
                </div>

                </div>
            </div>

            <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 10px; padding: 15px 25px; border-top: 1px solid #eee; flex-shrink: 0;">
                <button type="button" class="btn-sec" onclick="closeModalCliente()" style="background: #95a5a6; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor:pointer;">Cancelar</button>
                <button type="submit" class="btn-pri" style="background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor:pointer;">Guardar Cliente</button>
            </div>
        </form>
    </div>
</div>
