<div id="modalRuta" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:flex-start; overflow-y:auto; padding:20px 0;">
    <div style="background:white; width:90%; max-width:450px; border-radius:8px; box-sizing:border-box; margin:auto; display:flex; flex-direction:column; max-height:calc(100vh - 40px);">

        <div style="display:flex; justify-content:space-between; align-items:center; padding:18px 25px 15px; border-bottom:1px solid #eee; flex-shrink:0;">
            <h3 id="modalTitleRuta" style="margin:0; color:#2c3e50;">Nueva Ruta</h3>
            <button onclick="closeModalRuta()" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:#95a5a6;">&times;</button>
        </div>

        <form action="{{ url_for('rutas.guardar') }}" method="POST" id="formRuta" style="display:flex; flex-direction:column; flex:1; min-height:0;">
            <input type="hidden" name="id_ruta" id="form_id_ruta">

            <div style="overflow-y:auto; flex:1; padding:20px 25px;">
                <div style="margin-bottom:15px;">
                    <label style="display:block; font-size:0.85rem; font-weight:bold; color:#34495e; margin-bottom:5px;">Nombre de la Ruta / Zona *</label>
                    <input type="text" name="nombre_ruta" id="form_nombre_ruta" required placeholder="Ej: Zona Norte, Rosario, GBA"
                           style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:10px;">
                    <label style="display:block; font-size:0.85rem; font-weight:bold; color:#34495e; margin-bottom:5px;">Descripción / Notas</label>
                    <textarea name="descripcion" id="form_descripcion" rows="3" placeholder="Detalles adicionales sobre la logística en esta zona..."
                              style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px; box-sizing:border-box; resize:vertical;"></textarea>
                </div>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:10px; padding:15px 25px; border-top:1px solid #eee; flex-shrink:0;">
                <button type="button" onclick="closeModalRuta()" style="padding:10px 18px; border:1px solid #ccc; background:white; border-radius:4px; cursor:pointer; color:#7f8c8d;">Cancelar</button>
                <button type="submit" style="padding:10px 20px; background:#3498db; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">
                    <i class="fas fa-save"></i> Guardar Ruta
                </button>
            </div>
        </form>
    </div>
</div>
