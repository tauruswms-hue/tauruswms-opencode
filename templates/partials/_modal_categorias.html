<div id="modalCategorias" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle">Nueva Categoría</h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form action="{{ url_for('categorias.guardar') }}" method="POST" id="formCategorias">
            <input type="hidden" name="id_categoria" id="form_id_cat">

            <div class="modal-scroll-body">
                <div class="form-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Código *</label>
                            <input type="text" name="codigo" id="form_codigo" required maxlength="{{ codigo_max }}">
                            <small style="color:#888;">Identifica a la categoría: no puede repetirse. Las importaciones de materiales y el Intercambio la buscan por este código.</small>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre *</label>
                            <input type="text" name="nombre" id="form_nombre" required maxlength="{{ nombre_max }}">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Descripción</label>
                            <textarea name="descripcion" id="form_desc" rows="3" style="width:100%; border:1px solid #ddd; border-radius:4px; padding:8px;"></textarea>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="form_activo">Estado</label>
                            <select name="activo" id="form_activo" title="Una categoría inactiva no se ofrece al cargar materiales" style="padding:8px; border:1px solid #ddd; border-radius:4px; max-width:180px;">
                                <option value="1">Activa</option>
                                <option value="0">Inactiva</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-sec" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-pri">Guardar Categoría</button>
            </div>
        </form>
    </div>
</div>
