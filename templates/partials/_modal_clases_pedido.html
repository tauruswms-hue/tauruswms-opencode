<div id="modalClasesPedido" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalClaseTitle">Nueva Clase de Pedido</h3>
            <button class="close-btn" onclick="closeModalClase()">&times;</button>
        </div>
        <form action="{{ url_for('clases_pedido.guardar') }}" method="POST" id="formClasesPedido">
            <input type="hidden" name="id_clase" id="form_id_clase">

            <div class="modal-scroll-body">
                <div class="form-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre *</label>
                            <input type="text" name="nombre" id="form_clase_nombre" required maxlength="{{ nombre_max }}">
                            <small style="color:#888;">Identifica a la clase: no puede repetirse. El Intercambio y la importación de pedidos la buscan por este nombre.</small>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="form_clase_activo">Estado</label>
                            <select name="activo" id="form_clase_activo" title="Una clase inactiva no se ofrece al cargar pedidos" style="padding:10px; border:1px solid #d1d5db; border-radius:4px; max-width:180px;">
                                <option value="1">Activa</option>
                                <option value="0">Inactiva</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-sec" onclick="closeModalClase()">Cancelar</button>
                <button type="submit" class="btn-pri">Guardar</button>
            </div>
        </form>
    </div>
</div>
