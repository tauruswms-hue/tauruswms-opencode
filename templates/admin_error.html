<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taurus Suite - Error {{ codigo }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="text-center">
            <p class="display-1 fw-bold text-primary mb-0">{{ codigo }}</p>
            <h1 class="h3 mb-3">{{ mensaje }}</h1>
            <p class="text-muted mb-4">{{ detalle }}</p>
            <a href="{{ url_for('admin.tenants') if session.get('admin_rol') else url_for('admin.login') }}"
               class="btn btn-primary">
                <i class="fas fa-home me-1"></i> Volver al panel
            </a>
        </div>
    </div>
</body>
</html>
