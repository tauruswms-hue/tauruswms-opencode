name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .
      - name: Schemas generados al día
        # Si falla: correr `python modules/schema_generator.py --all` y commitear el resultado.
        run: |
          python modules/schema_generator.py --all
          git diff --exit-code -- schema_*.sql docs/migrations/create_*.sql

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Taurus_2001
          MYSQL_DATABASE: taurus_admin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Config .env (CI)
        run: |
          cp .env.example .env
          python -c "import secrets; print('SECRET_KEY=' + secrets.token_hex(32))" >> .env
          python -c "import secrets; print('ADMIN_SECRET_KEY=' + secrets.token_hex(32))" >> .env
          python -c "import secrets; print('SECRET_SALT=' + secrets.token_hex(32))" >> .env
      - name: Conexiones (CI)
        # Apunta las tres bases al MySQL del servicio con root, el único usuario
        # que existe en el contenedor (credenciales solo de CI).
        run: |
          python - <<'PY'
          import json
          json.dump({b: {'engine': 'mysql', 'host': '127.0.0.1', 'port': 3306, 'user': 'root',
                         'password': 'Taurus_2001', 'database': f'taurus_{b}'}
                     for b in ('admin', 'wms', 'intercambio')},
                    open('conexiones.json', 'w'), indent=2)
          PY
      - name: Bootstrap schema
        run: |
          python generar_schema.py --engine mysql --execute
          python modules/schema_generator.py --all
      - run: pytest -q

  docker:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker compose build wms admin
