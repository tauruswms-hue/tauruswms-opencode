# Entorno de desarrollo. Las conexiones a las bases salen de
# conexiones.docker.json (usuario root y contraseña por defecto del servicio
# mysql): si se cambia MYSQL_ROOT_PASSWORD hay que cambiarla también ahí.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Taurus_2001}
      MYSQL_DATABASE: taurus_admin
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-Taurus_2001}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"

  wms:
    build: .
    command: python app.py
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-only-key-no-usar-en-produccion}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-dev-only-key-no-usar-en-produccion}
      SECRET_SALT: ${SECRET_SALT:-dev-only-salt-no-usar-en-produccion}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./picking_docs:/app/picking_docs
      - ./conexiones.docker.json:/app/conexiones.json:ro

  admin:
    build: .
    command: python admin.py
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-only-key-no-usar-en-produccion}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-dev-only-key-no-usar-en-produccion}
      SECRET_SALT: ${SECRET_SALT:-dev-only-salt-no-usar-en-produccion}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5001:5001"
    volumes:
      - ./conexiones.docker.json:/app/conexiones.json:ro

volumes:
  mysql_data:
